<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Minny ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins&display=swap" rel="stylesheet">

<style>
body,html{margin:0;padding:0;width:100%;height:100%;background:black;color:white;font-family:'Poppins',sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;background:url('assets/images/hero-opening-love.jpg') center/cover no-repeat;filter:brightness(.35);z-index:-2}
#stars{position:fixed;inset:0;background:radial-gradient(white 1px, transparent 1px);background-size:50px 50px;opacity:.2;animation:twinkle 4s infinite alternate;z-index:-1}
@keyframes twinkle{from{opacity:.1}to{opacity:.4}}
.scene{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center}
.scene.active{display:flex}
.card{background:rgba(0,0,0,.7);border-radius:25px;padding:30px;width:90%;max-width:500px;box-shadow:0 0 40px hotpink}
h1{font-family:'Dancing Script',cursive;color:pink}
button{padding:12px 25px;border-radius:30px;border:none;background:linear-gradient(45deg,pink,purple);color:white;margin:8px;font-weight:bold}
img.future{width:100%;border-radius:15px;margin:10px 0;box-shadow:0 0 30px pink}
#loveBar{width:100%;height:20px;background:#333;border-radius:10px;overflow:hidden}
#loveFill{height:100%;width:0%;background:linear-gradient(90deg,pink,hotpink)}
</style>
</head>
<body>

<div id="bg"></div>
<div id="stars"></div>

<audio id="musicIntro" src="assets/music/bg-music-intro-meri-jaan.mp3" loop></audio>
<audio id="musicRomantic" src="assets/music/bg-music-romantic-ambience.mp3" loop></audio>
<audio id="musicFinal" src="assets/music/bg-music-final-letter.mp3" loop></audio>
<audio id="sunnyMessage" src="assets/voice/sunnys-message.mp3"></audio>

<div class="scene active" id="s1"><div class="card">
<h1>Secret Access 💜</h1>
<input id="pw" placeholder="Enter password"><br><br>
<button onclick="checkPW()">Unlock</button>
</div></div>

<div class="scene" id="s2"><div class="card">
<h1>Darkness 🌑</h1>
<button onclick="turnOn()">⚡ Turn On Light</button>
</div></div>

<div class="scene" id="s3"><div class="card">
<h1>Get Ready 💖</h1>
<div id="count" style="font-size:70px">10</div>
</div></div>

<div class="scene" id="s4"><div class="card">
<h1>🎉 Happy Birthday Minny 🎂</h1>
<button onclick="goFuture()">Our Journey 📸</button>
</div></div>

<div class="scene" id="s5"><div class="card">
<h1>Our Journey 💞</h1>
<img class="future" src="assets/images/future-photo-traditional-evening.png">
<img class="future" src="assets/images/scene-romantic-sky-couple.png">
<img class="future" src="assets/images/scene-romantic-generated.png">
<button onclick="goLove()">Fill Our Love 💗</button>
</div></div>

<div class="scene" id="s6"><div class="card">
<h1>Love Potion 💖</h1>
<div id="loveBar"><div id="loveFill"></div></div>
<p id="loveTxt">0%</p>
<button onclick="addLove()">Add Love 💕</button>
</div></div>

<div class="scene" id="s7"><div class="card">
<h1>From Sunny 💜</h1>
<button onclick="playSunny()">Play Sunny's Message 🎤</button>
</div></div>

<script>
const PASSWORD="Your imperfect husband";
let love=0;

function show(id){
 document.querySelectorAll('.scene').forEach(s=>s.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

function checkPW(){
 if(pw.value.trim()===PASSWORD){
   musicIntro.play();
   show('s2');
 } else alert("Wrong password 💔");
}

function turnOn(){
 show('s3');
 let n=10;
 count.textContent=n;
 const t=setInterval(()=>{
   n--;
   count.textContent=n;
   if(n<=0){
     clearInterval(t);
     show('s4');
     musicIntro.pause();
     musicRomantic.play();
   }
 },1000);
}

function goFuture(){show('s5');}
function goLove(){show('s6');}

function addLove(){
 love=Math.min(100,love+25);
 loveFill.style.width=love+'%';
 loveTxt.textContent=love+'%';
 if(love===100){
   musicRomantic.pause();
   musicFinal.play();
   show('s7');
 }
}

function playSunny(){
 sunnyMessage.play();
}
</script>

</body>
</html>
